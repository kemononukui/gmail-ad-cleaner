<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail広告整理</title><style>body{font-family:-apple-system,sans-serif;background:#fff7fb;color:#333;margin:0}main{max-width:650px;margin:auto;padding:12px}header{position:sticky;top:0;background:#fff7fb;padding:12px 0;border-bottom:1px solid #ddd;z-index:5}button,input{font:inherit;padding:12px;border-radius:12px}button{background:#d94683;color:white;border:0;flex:1}button:disabled{opacity:.4}.bar,.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row{background:white;padding:14px;border:1px solid #f1d9e5;border-radius:14px;margin:8px 0;box-shadow:0 1px 3px #ead9e2}.grow{flex:1;min-width:0}.small{font-size:12px;color:#777;overflow-wrap:anywhere}input[type=search],input[type=text]{width:100%;box-sizing:border-box}input[type=checkbox]{width:22px;height:22px}#list{max-height:52vh;overflow:auto}#status{font-weight:bold;color:#276f48} .sender{margin:10px 0;background:#fff;border:1px solid #f0d6e2;border-radius:14px;overflow:hidden}.sender .row{margin:0;border:0;box-shadow:none}.childtree{padding:4px 12px 12px 28px;border-top:1px solid #eee;border-left:3px solid #e8bbcf;margin-left:24px}.childtree summary{padding:12px 0;color:#7c3154;cursor:pointer}.childheading{font-weight:bold;font-size:13px;margin:12px 0 6px}.childmail{padding:9px 6px 9px 14px;border-left:2px solid #e8bbcf;border-bottom:1px solid #f5edf1;font-size:13px;overflow-wrap:anywhere}.childmail small{display:block;color:#666;margin-top:4px}.childmail.protected{border-left-color:#5d8d75;background:#f5fbf7} </style><script src="https://accounts.google.com/gsi/client" async defer></script><main><header><h2>💗 Gmail広告メール整理</h2><div id="status"></div><div class="bar"><button id="auth">Googleに接続</button><button id="refresh" disabled>更新</button></div><div class="bar"><button id="archive" disabled>アーカイブ</button><button id="trash" disabled>ゴミ箱</button></div><div id="summary" class="small"></div></header><details><summary>接続設定（初回のみ）</summary><p class="small">既存Google Cloudプロジェクトにウェブアプリ用OAuthクライアントを追加し、承認済みJavaScript生成元に https://kemononukui.github.io を登録。Gmail APIを有効化し、自分をテストユーザーに登録してください。</p><input id="client" type="text" placeholder="xxxxx.apps.googleusercontent.com"><button id="save">ID保存</button></details><h3 style="margin:18px 0 8px">差出人一覧</h3><div class="bar"><input id="filter" type="search" placeholder="送信元を検索" style="flex:1;min-width:0"><select id="sort" aria-label="並び順" style="font:inherit;padding:10px;border-radius:12px"><option value="count">件数順</option><option value="name">名前順</option></select></div><div class="bar"><button id="all">安全候補を全選択</button><button id="clear">解除</button></div><p class="small">🛡 FC・購入・注文・決済・発送・返品・返金・チケット・重要通知を保護。曖昧なメールも処理しません。</p><p class="small">差出人を選択して、上部のボタンで整理できます。</p><div id="list"></div></main><script>window.addEventListener("error",function(e){document.getElementById("status").textContent="JavaScriptエラー: "+(e.message||"読み込み失敗")});document.addEventListener("DOMContentLoaded",function(){var b=document.getElementById("auth");b.addEventListener("click",function(){document.getElementById("status").textContent="ボタン反応あり・認証処理を確認中…"},true);var a=document.querySelector('script[src^="app.js"]');if(a)a.addEventListener("error",function(){document.getElementById("status").textContent="アプリのプログラムを読み込めませんでした"});setTimeout(function(){if(!b.onclick)document.getElementById("status").textContent="アプリの初期化に失敗しました。Safariでページを再読み込みしてください"},700)})</script><script src="app.js?v=20261121-10"></script>

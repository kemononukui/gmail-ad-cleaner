<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail広告整理</title><style>body{font-family:-apple-system,sans-serif;background:#fff7fb;color:#333;margin:0}main{max-width:650px;margin:auto;padding:12px}header{position:sticky;top:0;background:#fff7fb;padding:12px 0;border-bottom:1px solid #ddd}button,input{font:inherit;padding:12px;border-radius:12px}button{background:#d94683;color:white;border:0;flex:1}button:disabled{opacity:.4}.bar,.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row{background:white;padding:12px;border-bottom:1px solid #eee}.grow{flex:1;min-width:0}.small{font-size:12px;color:#777;overflow-wrap:anywhere}input[type=search],input[type=text]{width:100%;box-sizing:border-box}input[type=checkbox]{width:22px;height:22px}#list{max-height:52vh;overflow:auto}#status{font-weight:bold;color:#276f48}</style><script src="https://accounts.google.com/gsi/client" async defer></script><main><header><h2>💗 Gmail広告メール整理</h2><div id="status"></div><div class="bar"><button id="auth">Googleに接続</button><button id="refresh" disabled>更新</button></div><div class="bar"><button id="archive" disabled>アーカイブ</button><button id="trash" disabled>ゴミ箱</button></div><div id="summary" class="small"></div></header><details><summary>初回設定：OAuthクライアントID</summary><p class="small">既存Google Cloudプロジェクトにウェブアプリ用OAuthクライアントを追加し、承認済みJavaScript生成元に https://kemononukui.github.io を登録。Gmail APIを有効化し、自分をテストユーザーに登録してください。</p><input id="client" type="text" placeholder="xxxxx.apps.googleusercontent.com"><button id="save">ID保存</button></details><p><input id="filter" type="search" placeholder="送信元を検索"></p><div class="bar"><button id="all">安全候補を全選択</button><button id="clear">解除</button></div><p class="small">🛡 FC・購入・注文・決済・発送・返品・返金・チケット・重要通知を保護。曖昧なメールも処理しません。</p><div id="list"></div></main><script src="app.js?v=20261121-2"></script>
